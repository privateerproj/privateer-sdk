issuer: https://token.actions.githubusercontent.com
# Issue the scan token only to the workflow running on main, never to branches or PRs
subject: repo:privateerproj/privateer-sdk:ref:refs/heads/main
claim_pattern:
  job_workflow_ref: "^privateerproj/privateer-sdk/.github/workflows/osps-security-assessment.yml@refs/heads/main$"

permissions:
  contents: read
  statuses: read
  deployments: read
  security_events: read
  administration: read
